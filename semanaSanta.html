<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A esta es...</title>
<style>
body {
    margin: 0;
    height: 100vh;
    background-color: #000000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Times New Roman', Times, serif;
    overflow: hidden;
    position: relative;
    transition: background-color 1s ease-in-out;
}
.capaFondoImagen {
    position: absolute;
    top: -5%;
    left: -5%;
    width: 110%;
    height: 110%;
    background-image: url('capirotes.jpg');
    background-size: cover;
    background-position: center;
    filter: blur(8px);
    z-index: 1;
    transition: opacity 1s ease-in-out;
}
.capaFondoImagen.oculto {
    opacity: 0;
}
.capaMarcoOscuro {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, rgba(0,0,0,0.1) 10%, rgba(0,0,0,0.8) 70%, #000000 100%);
    z-index: 2;
}
.contenedorTextos {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    text-align: center;
}
.textoSuperior {
    color: #ffffff;
    font-size: 1.4rem;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 1rem;
    text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.8);
}
.numerosCuenta {
    display: flex;
    align-items: center;
    font-size: 7vw;
    line-height: 1;
    color: #ffffff;
    text-shadow: 0px 5px 15px rgba(0, 0, 0, 0.9);
}
.puntoSeparador {
    margin: 0 8px;
    transform: translateY(-8px);
}
.cifra {
    display: inline-block;
    transition: filter 0.25s ease-in-out, opacity 0.25s ease-in-out;
    filter: blur(0px);
    opacity: 1;
}
.cifraDesenfocada {
    filter: blur(12px);
    opacity: 0.2;
}
.textoInferior {
    margin-top: 1.5rem;
    color: #cccccc;
    font-size: 0.9rem;
    letter-spacing: 6px;
    text-transform: uppercase;
    text-shadow: 0px 2px 5px rgba(0, 0, 0, 0.8);
}
.pieDePagina {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 25px 50px;
    box-sizing: border-box;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    z-index: 4;
}
.nombreFooter {
    color: #ffffff;
    font-size: 1.1rem;
    font-weight: bold;
    font-style: italic;
    letter-spacing: 2px;
}
.derechosFooter {
    color: #444444;
    font-size: 0.75rem;
    font-style: italic;
    letter-spacing: 2px;
    text-transform: uppercase;
}
</style>
</head>
<body id="cuerpoDocumento">
<div class="capaFondoImagen" id="capaFondo"></div>
<div class="capaMarcoOscuro"></div>
<div class="contenedorTextos">
    <div class="textoSuperior" id="etiquetaSuperior">A ESTA ES...</div>
    <div class="numerosCuenta">
        <div class="cifra" id="contadorDias">00</div>
        <div class="puntoSeparador">.</div>
        <div class="cifra" id="contadorHoras">00</div>
        <div class="puntoSeparador">.</div>
        <div class="cifra" id="contadorMinutos">00</div>
        <div class="puntoSeparador">.</div>
        <div class="cifra" id="contadorSegundos">00</div>
    </div>
    <div class="textoInferior" id="etiquetaInferior">SEMANA SANTA</div>
</div>
<footer class="pieDePagina">
    <div class="nombreFooter">IVÁN RUBIO MURILLO</div>
    <div class="derechosFooter">&copy; 2026 — TODOS LOS DERECHOS RESERVADOS</div>
</footer>
<script>
const nodoDias = document.getElementById('contadorDias');
const nodoHoras = document.getElementById('contadorHoras');
const nodoMinutos = document.getElementById('contadorMinutos');
const nodoSegundos = document.getElementById('contadorSegundos');
const etiquetaSuperior = document.getElementById('etiquetaSuperior');
const etiquetaInferior = document.getElementById('etiquetaInferior');
const capaFondo = document.getElementById('capaFondo');
const cuerpoDocumento = document.getElementById('cuerpoDocumento');

const coloresDias = {
    0: '#4a0000', 
    1: '#2b004a', 
    2: '#2b004a', 
    3: '#2b004a', 
    4: '#1a1a1a', 
    5: '#000000', 
    6: '#0f0f0f'  
};

function calcularDomingoResurreccion(anio) {
    const a = anio % 19;
    const b = Math.floor(anio / 100);
    const c = anio % 100;
    const d = Math.floor(b / 4);
    const e = b % 4;
    const f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4);
    const k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const mes = Math.floor((h + l - 7 * m + 114) / 31) - 1;
    const dia = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(anio, mes, dia);
}

function actualizarCifra(nodoHtml, valorNuevo) {
    if (nodoHtml.innerText !== valorNuevo && nodoHtml.innerText !== "00") {
        nodoHtml.classList.add('cifraDesenfocada');
        setTimeout(() => {
            nodoHtml.innerText = valorNuevo;
            nodoHtml.classList.remove('cifraDesenfocada');
        }, 250);
    } else if (nodoHtml.innerText === "00") {
        nodoHtml.innerText = valorNuevo;
    }
}

function procesarCicloSemanaSanta() {
    const fechaActual = new Date();
    let anioObjetivo = fechaActual.getFullYear();
    
    let domingoResurreccion = calcularDomingoResurreccion(anioObjetivo);
    let inicioSemanaSanta = new Date(domingoResurreccion.getTime());
    inicioSemanaSanta.setDate(domingoResurreccion.getDate() - 7);
    inicioSemanaSanta.setHours(0, 0, 0, 0);

    let finSemanaSanta = new Date(domingoResurreccion.getTime());
    finSemanaSanta.setHours(23, 59, 59, 999);

    if (fechaActual.getTime() > finSemanaSanta.getTime()) {
        anioObjetivo++;
        domingoResurreccion = calcularDomingoResurreccion(anioObjetivo);
        inicioSemanaSanta = new Date(domingoResurreccion.getTime());
        inicioSemanaSanta.setDate(domingoResurreccion.getDate() - 7);
        inicioSemanaSanta.setHours(0, 0, 0, 0);
        finSemanaSanta = new Date(domingoResurreccion.getTime());
        finSemanaSanta.setHours(23, 59, 59, 999);
    }

    let tiempoRestante = 0;
    let diaDeLaSemana = fechaActual.getDay();

    if (fechaActual.getTime() < inicioSemanaSanta.getTime()) {
        tiempoRestante = inicioSemanaSanta.getTime() - fechaActual.getTime();
        etiquetaSuperior.innerText = "A ESTA ES...";
        etiquetaInferior.innerText = `SEMANA SANTA ${anioObjetivo}`;
        capaFondo.classList.remove('oculto');
        cuerpoDocumento.style.backgroundColor = "#000000";
    } else {
        tiempoRestante = finSemanaSanta.getTime() - fechaActual.getTime();
        etiquetaSuperior.innerText = "TERMINA EN...";
        etiquetaInferior.innerText = "DOMINGO DE RESURRECCIÓN";
        capaFondo.classList.add('oculto');
        cuerpoDocumento.style.backgroundColor = coloresDias[diaDeLaSemana];
    }

    const calculoDias = Math.floor(tiempoRestante / (1000 * 60 * 60 * 24));
    const calculoHoras = Math.floor((tiempoRestante % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const calculoMinutos = Math.floor((tiempoRestante % (1000 * 60 * 60)) / (1000 * 60));
    const calculoSegundos = Math.floor((tiempoRestante % (1000 * 60)) / 1000);

    actualizarCifra(nodoDias, calculoDias.toString().padStart(2, '0'));
    actualizarCifra(nodoHoras, calculoHoras.toString().padStart(2, '0'));
    actualizarCifra(nodoMinutos, calculoMinutos.toString().padStart(2, '0'));
    actualizarCifra(nodoSegundos, calculoSegundos.toString().padStart(2, '0'));
}

setInterval(procesarCicloSemanaSanta, 1000);
procesarCicloSemanaSanta();
</script>
</body>
</html>
